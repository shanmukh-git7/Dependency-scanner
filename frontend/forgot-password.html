<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Dependency Scanner</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="brand">🛡️ Dependency Scanner</a>
        <div class="nav-links">
            <button id="theme-toggle" class="theme-toggle">🌙</button>
        </div>
    </nav>

    <div class="auth-container">
        <h2 style="text-align: center; margin-bottom: 2rem;">Recover Password</h2>
        <form id="forgot-password-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="Enter your registered email">
            </div>
            <button type="submit" class="btn-primary">Send Reset Link</button>
        </form>
        <p id="recovery-message" style="margin-top: 1.5rem; text-align: center; display: none;" class="text-success"></p>
        <div id="proceed-area" style="display: none; margin-top: 2rem; text-align: center;">
            <a href="reset-password.html" class="btn-primary" style="display: inline-block; text-decoration: none;">Proceed to Enter OTP</a>
        </div>
        <p style="margin-top: 1.5rem; text-align: center;"><a href="login.html">Back to Login</a></p>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
