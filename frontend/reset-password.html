<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Dependency Scanner</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="brand">🛡️ Dependency Scanner</a>
        <div class="nav-links">
            <button id="theme-toggle" class="theme-toggle">🌙</button>
        </div>
    </nav>

    <div class="auth-container">
        <h2 style="text-align: center; margin-bottom: 2rem;">Set New Password</h2>
        <form id="reset-password-form">
            <div class="form-group">
                <label>Enter OTP</label>
                <input type="text" id="otp-input" required maxlength="6" pattern="\d{6}">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="new-password" required minlength="6">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm-password" required minlength="6">
            </div>
            <button type="submit" class="btn-primary">Update Password</button>
        </form>
        <p style="margin-top: 1.5rem; text-align: center;"><a href="login.html">Back to Login</a></p>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
