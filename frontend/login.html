<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dependency Scanner</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="brand">🛡️ Dependency Scanner</a>
        <div class="nav-links">
            <button id="theme-toggle" class="theme-toggle">🌙</button>
        </div>
    </nav>

    <div class="auth-container">
        <h2 style="text-align: center; margin-bottom: 2rem;">Welcome Back</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-primary">Login</button>
        </form>
        <p style="margin-top: 1rem; text-align: center;"><a href="forgot-password.html">Forgot Password?</a></p>
        <p style="margin-top: 0.5rem; text-align: center;">Need an account? <a href="register.html">Register</a></p>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
